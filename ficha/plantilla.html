<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- DEMO: fuera de buscadores (requerimiento 0.2) -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Plantilla de /yate/{id}/{slug} (requerimiento 7.3 y 7.5). El servidor la usa para cualquier
       yate o modelo y main.js la llena con data/listings.json o data/modelos.json. -->
  <title>Yachtcancun</title>
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Geist:wght@400;500;600&family=Raleway:ital,wght@0,300..600;1,300..400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="is-loading">

  <!--#include virtual="/partials/header.html" -->

  <main id="contenido" data-page="ficha">

    <!-- 1. Migas de pan -->
    <nav class="crumbs" aria-label="Migas de pan" data-render="y-crumbs"></nav>

    <!-- 2. Galería (mosaico + visor a pantalla completa con pestañas) -->
    <section class="ygal" data-render="y-gallery" aria-label="Galería"></section>

    <!-- 3–4. Encabezado, precio y CTAs -->
    <section class="yhead">
      <div class="yhead__main" data-render="y-head"></div>
      <aside class="yhead__aside" data-render="y-price"></aside>
    </section>

    <!-- 5. Datos clave -->
    <section class="ykey" data-render="y-key"></section>

    <!-- 6–7. Descripción y especificaciones -->
    <section class="ydetail">
      <div class="ydetail__desc" data-render="y-desc"></div>
      <div class="ydetail__specs" data-render="y-specs"></div>
    </section>

    <!-- 8. Video -->
    <section class="bvideo yvideo" data-render="brand-video" hidden></section>

    <!-- 9–10. Broker, formulario y compartir -->
    <section class="cx-form" id="contacto-yate">
      <div class="cx-form__intro">
        <p class="eyebrow" data-i18n="brand_broker_eyebrow"></p>
        <h2 class="cx-form__title" data-i18n="brand_broker_title"></h2>
        <p data-i18n="brand_broker_text"></p>
        <div class="bbroker" data-render="y-broker"></div>
        <div class="yshare" data-render="y-share"></div>
      </div>
      <form class="form" novalidate data-lead="yate">
        <div class="hp" aria-hidden="true"><input name="empresa" tabindex="-1" autocomplete="off"></div>
        <input type="hidden" name="listing_id" data-render="y-id">
        <fieldset class="field">
          <label for="y-nombre" data-i18n="f_name"></label>
          <input id="y-nombre" name="nombre" autocomplete="name" required data-i18n-attr="placeholder:ph_name">
        </fieldset>
        <div class="form__row">
          <fieldset class="field">
            <label for="y-correo" data-i18n="f_email"></label>
            <input id="y-correo" name="correo" type="email" autocomplete="email" required data-i18n-attr="placeholder:ph_email">
          </fieldset>
          <fieldset class="field">
            <label for="y-tel" data-i18n="f_phone"></label>
            <input id="y-tel" name="telefono" type="tel" autocomplete="tel" required data-i18n-attr="placeholder:ph_phone">
          </fieldset>
        </div>
        <fieldset class="field">
          <legend data-i18n="y_want"></legend>
          <div class="seg seg--3">
            <label><input type="radio" name="motivo" value="info" checked><span data-i18n="y_want_info"></span></label>
            <label><input type="radio" name="motivo" value="visita"><span data-i18n="y_want_visit"></span></label>
            <label><input type="radio" name="motivo" value="oferta"><span data-i18n="y_want_offer"></span></label>
          </div>
        </fieldset>
        <fieldset class="field">
          <label for="y-msg"><span data-i18n="f_message"></span><em data-i18n="f_optional"></em></label>
          <textarea id="y-msg" name="mensaje" rows="5" data-render="y-msg"></textarea>
        </fieldset>
        <label class="check"><input type="checkbox" name="privacidad" required> <span><span data-i18n="f_privacy_pre"></span> <a href="/aviso-de-privacidad" data-i18n="nav_privacy"></a></span></label>
        <button class="btn btn--block" type="submit"><span data-i18n="f_submit"></span></button>
        <div class="form__ok" role="status" hidden>
          <p class="form__ok-title" data-i18n="f_success_title"></p>
          <p data-i18n="f_success"></p>
        </div>
      </form>
    </section>

    <!-- 11. Similares / otros modelos de la línea -->
    <section class="promo ysim" data-render="y-similar-section" hidden>
      <header class="section-head section-head--row">
        <div>
          <p class="eyebrow" data-i18n="feat_eyebrow"></p>
          <h2 class="section-title" data-render="y-similar-title"></h2>
        </div>
      </header>
      <ul class="results__grid ysim__grid" data-render="y-similar"></ul>
    </section>
  </main>

  <!-- Visor de galería a pantalla completa -->
  <div class="lb" data-render="y-lightbox" hidden role="dialog" aria-modal="true" aria-label="Galería"></div>

  <!-- Modal "Descargar brochure" (entrega un PDF de ejemplo en la demo) -->
  <div class="modal" data-render="y-brochure" hidden role="dialog" aria-modal="true" aria-labelledby="bro-title">
    <div class="modal__box">
      <button type="button" class="modal__close" data-close aria-label="Cerrar">×</button>
      <h2 class="modal__title" id="bro-title" data-i18n="bro_title"></h2>
      <p class="modal__text" data-i18n="bro_text"></p>
      <form class="form" novalidate data-lead="brochure">
        <div class="hp" aria-hidden="true"><input name="empresa" tabindex="-1" autocomplete="off"></div>
        <input type="hidden" name="listing_id" data-render="y-id">
        <fieldset class="field"><label for="bro-nombre" data-i18n="f_name"></label><input id="bro-nombre" name="nombre" autocomplete="name" required></fieldset>
        <div class="form__row">
          <fieldset class="field"><label for="bro-correo" data-i18n="f_email"></label><input id="bro-correo" name="correo" type="email" autocomplete="email" required></fieldset>
          <fieldset class="field"><label for="bro-tel" data-i18n="f_phone"></label><input id="bro-tel" name="telefono" type="tel" autocomplete="tel" required></fieldset>
        </div>
        <div class="form__row">
          <fieldset class="field">
            <label for="bro-pres" data-i18n="f_budget"></label>
            <select id="bro-pres" name="presupuesto" required>
              <option value="" data-i18n="f_choose"></option>
              <option value="250-500k">USD 250,000 – 500,000</option>
              <option value="500k-1m">USD 500,000 – 1,000,000</option>
              <option value="1m-2m">USD 1,000,000 – 2,000,000</option>
              <option value="2m+" data-i18n="f_budget_top"></option>
            </select>
          </fieldset>
          <fieldset class="field">
            <label for="bro-plazo" data-i18n="bro_when"></label>
            <select id="bro-plazo" name="plazo" required>
              <option value="" data-i18n="f_choose"></option>
              <option value="3m" data-i18n="bro_3m"></option>
              <option value="6m" data-i18n="bro_6m"></option>
              <option value="1a" data-i18n="bro_1y"></option>
              <option value="1a+" data-i18n="bro_1y_plus"></option>
            </select>
          </fieldset>
        </div>
        <label class="check"><input type="checkbox" name="privacidad" required> <span><span data-i18n="f_privacy_pre"></span> <a href="/aviso-de-privacidad" data-i18n="nav_privacy"></a></span></label>
        <button class="btn btn--block" type="submit"><span data-i18n="bro_submit"></span></button>
        <div class="form__ok" role="status" hidden>
          <p class="form__ok-title" data-i18n="bro_ok_title"></p>
          <p><a class="btn btn--solid" href="/assets/docs/brochure-ejemplo.pdf" download><span data-i18n="bro_download"></span></a></p>
        </div>
      </form>
    </div>
  </div>

  <!--#include virtual="/partials/footer.html" -->
</body>
</html>
